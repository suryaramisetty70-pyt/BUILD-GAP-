services:
  - type: web
    name: gaplab
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
